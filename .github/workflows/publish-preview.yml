name: Publish client preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build && npm run export
      - name: Prepare self-contained public demo
        run: |
          mkdir -p release/public-demo
          cp release/loud-cana-preview.html release/public-demo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/public-demo
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
